[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coolname-eponym"
version = "0.1.0"
description = "Generate evocative, photorealistic images from coolname adjective-animal slugs"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "coolname>=4.0",
    "click>=8.0",
    "Pillow>=10.0",
    "requests>=2.28",
]

[project.optional-dependencies]
diffusers = [
    "diffusers>=0.26",
    "torch>=2.0",
    "transformers>=4.36",
    "accelerate>=0.25",
]
dev = [
    "pytest>=7.0",
    "pytest-mock>=3.0",
]

[project.scripts]
coolname-eponym = "coolname_eponym.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["coolname_eponym*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
